<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1152" viewBox="0 0 720 1152" font-family="Arial, Helvetica, sans-serif"><rect width="100%" height="100%" fill="white"/><text x="34" y="64" font-size="31" fill="#0f172a" font-weight="700" text-anchor="start">Roles vs. tasks</text><text x="34" y="86.0" font-size="18" fill="#475569" font-weight="400" text-anchor="start">Same lifecycle. The work record preserves context; specialist sessions</text><text x="34" y="111.2" font-size="18" fill="#475569" font-weight="400" text-anchor="start">handle execution.</text><rect x="34" y="160.4" width="652" height="204.99999999999997" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/><text x="54" y="192.4" font-size="15" fill="#475569" font-weight="700" text-anchor="start">ROLE-BASED COORDINATION</text><rect x="54" y="210.4" width="94" height="70" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="101" y="234.4" font-size="17" fill="#0f172a" font-weight="700" text-anchor="middle">Business</text><text x="101" y="255.4" font-size="17" fill="#0f172a" font-weight="700" text-anchor="middle">analyst</text><text x="163" y="253.4" font-size="24" fill="#94a3b8" font-weight="700" text-anchor="middle">→</text><rect x="180" y="210.4" width="94" height="70" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="227" y="244.4" font-size="17" fill="#0f172a" font-weight="700" text-anchor="middle">Architect</text><text x="289" y="253.4" font-size="24" fill="#94a3b8" font-weight="700" text-anchor="middle">→</text><rect x="306" y="210.4" width="94" height="70" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="353" y="244.4" font-size="17" fill="#0f172a" font-weight="700" text-anchor="middle">Developer</text><text x="415" y="253.4" font-size="24" fill="#94a3b8" font-weight="700" text-anchor="middle">→</text><rect x="432" y="210.4" width="94" height="70" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="479" y="244.4" font-size="17" fill="#0f172a" font-weight="700" text-anchor="middle">QA</text><text x="541" y="253.4" font-size="24" fill="#94a3b8" font-weight="700" text-anchor="middle">→</text><rect x="558" y="210.4" width="94" height="70" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="605" y="234.4" font-size="17" fill="#0f172a" font-weight="700" text-anchor="middle">Release</text><text x="605" y="255.4" font-size="17" fill="#0f172a" font-weight="700" text-anchor="middle">manager</text><text x="54" y="301.4" font-size="17.5" fill="#334155" font-weight="400" text-anchor="start">An illustrative role arrangement. Roles carry expertise and</text><text x="54" y="325.9" font-size="17.5" fill="#334155" font-weight="400" text-anchor="start">accountability; the lifecycle itself does not prescribe these five roles.</text><rect x="34" y="389.4" width="652" height="580.0" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/><text x="54" y="421.4" font-size="15" fill="#1d4ed8" font-weight="700" text-anchor="start">TASK-CENTERED COORDINATION AND SPECIALIST EXECUTION</text><rect x="54" y="451.4" width="612" height="87" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="70" y="480.4" font-size="19" fill="#0f172a" font-weight="700" text-anchor="start">One authoritative record links the artifacts</text><rect x="70" y="493.4" width="121.82000000000002" height="26" rx="13" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/><text x="81" y="511.4" font-size="15.5" fill="#334155" font-weight="400" text-anchor="start">requirements</text><rect x="198.82000000000002" y="493.4" width="91.44000000000001" height="26" rx="13" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/><text x="209.82000000000002" y="511.4" font-size="15.5" fill="#334155" font-weight="400" text-anchor="start">decisions</text><rect x="297.26000000000005" y="493.4" width="74.08000000000001" height="26" rx="13" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/><text x="308.26000000000005" y="511.4" font-size="15.5" fill="#334155" font-weight="400" text-anchor="start">checks</text><rect x="378.34000000000003" y="493.4" width="108.80000000000001" height="26" rx="13" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/><text x="389.34000000000003" y="511.4" font-size="15.5" fill="#334155" font-weight="400" text-anchor="start">next action</text><rect x="54" y="552.4" width="612" height="48.0" rx="10" fill="#fff" stroke="#bfdbfe" stroke-width="2"/><text x="68" y="580.4" font-size="19" fill="#0f172a" font-weight="700" text-anchor="start">Define</text><rect x="180" y="562.4" width="193.6" height="26" rx="13" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/><text x="191" y="580.4" font-size="15" fill="#1e3a8a" font-weight="400" text-anchor="start">Codex via Hermes Agent</text><rect x="380.6" y="562.4" width="244.60000000000002" height="26" rx="13" fill="#fff" stroke="#cbd5e1" stroke-width="1"/><text x="391.6" y="580.4" font-size="15" fill="#334155" font-weight="400" text-anchor="start">board coordination configured</text><rect x="54" y="609.4" width="612" height="48.0" rx="10" fill="#fff" stroke="#bfdbfe" stroke-width="2"/><text x="68" y="637.4" font-size="19" fill="#0f172a" font-weight="700" text-anchor="start">Design</text><rect x="180" y="619.4" width="193.6" height="26" rx="13" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/><text x="191" y="637.4" font-size="15" fill="#1e3a8a" font-weight="400" text-anchor="start">Codex via Hermes Agent</text><rect x="380.6" y="619.4" width="244.60000000000002" height="26" rx="13" fill="#fff" stroke="#cbd5e1" stroke-width="1"/><text x="391.6" y="637.4" font-size="15" fill="#334155" font-weight="400" text-anchor="start">board coordination configured</text><rect x="54" y="666.4" width="612" height="48.0" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5"/><text x="68" y="694.4" font-size="19" fill="#0f172a" font-weight="700" text-anchor="start">Build</text><rect x="180" y="676.4" width="172.6" height="26" rx="13" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/><text x="191" y="694.4" font-size="15" fill="#1e3a8a" font-weight="400" text-anchor="start">Claude Code via Orca</text><rect x="359.6" y="676.4" width="194.20000000000002" height="26" rx="13" fill="#fff" stroke="#cbd5e1" stroke-width="1"/><text x="370.6" y="694.4" font-size="15" fill="#334155" font-weight="400" text-anchor="start">writes code on a branch</text><rect x="54" y="723.4" width="612" height="81.0" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5"/><text x="68" y="751.4" font-size="19" fill="#0f172a" font-weight="700" text-anchor="start">Verify</text><rect x="180" y="733.4" width="195.4" height="26" rx="13" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/><text x="191" y="751.4" font-size="15" fill="#1e3a8a" font-weight="400" text-anchor="start">separate Codex session</text><rect x="382.4" y="733.4" width="101.8" height="26" rx="13" fill="#fff" stroke="#cbd5e1" stroke-width="1"/><text x="393.4" y="751.4" font-size="15" fill="#334155" font-weight="400" text-anchor="start">runs tests</text><rect x="180" y="766.4" width="242.62600000000003" height="26" rx="13" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1"/><text x="191" y="784.4" font-size="15" fill="#4c1d95" font-weight="700" text-anchor="start">separate assessment planned</text><rect x="54" y="813.4" width="612" height="81.0" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5"/><text x="68" y="841.4" font-size="19" fill="#0f172a" font-weight="700" text-anchor="start">Review</text><rect x="180" y="823.4" width="122.80000000000001" height="26" rx="13" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/><text x="191" y="841.4" font-size="15" fill="#1e3a8a" font-weight="400" text-anchor="start">fresh session</text><rect x="309.8" y="823.4" width="122.80000000000001" height="26" rx="13" fill="#fff" stroke="#cbd5e1" stroke-width="1"/><text x="320.8" y="841.4" font-size="15" fill="#334155" font-weight="400" text-anchor="start">frozen commit</text><rect x="180" y="856.4" width="242.62600000000003" height="26" rx="13" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1"/><text x="191" y="874.4" font-size="15" fill="#4c1d95" font-weight="700" text-anchor="start">separate assessment planned</text><rect x="54" y="903.4" width="612" height="48.0" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" stroke-dasharray="7 5"/><text x="68" y="931.4" font-size="19" fill="#0f172a" font-weight="700" text-anchor="start">Release</text><rect x="180" y="913.4" width="38.8" height="26" rx="13" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/><text x="191" y="931.4" font-size="15" fill="#92400e" font-weight="400" text-anchor="start">me</text><rect x="225.8" y="913.4" width="311.8" height="26" rx="13" fill="#fff" stroke="#cbd5e1" stroke-width="1"/><text x="236.8" y="931.4" font-size="15" fill="#334155" font-weight="400" text-anchor="start">approve exact artifact and destination</text><text x="34" y="999.4" font-size="17.5" fill="#334155" font-weight="400" text-anchor="start">Worker routing and access enforcement are planned. A fresh session alone</text><text x="34" y="1023.9" font-size="17.5" fill="#334155" font-weight="400" text-anchor="start">does not guarantee independent judgment.</text><rect x="34" y="1063.4" width="135.82500000000002" height="26" rx="13" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/><text x="45" y="1081.4" font-size="14.5" fill="#334155" font-weight="400" text-anchor="start">Model or worker</text><rect x="176.82500000000002" y="1063.4" width="140.9" height="26" rx="13" fill="#fff" stroke="#cbd5e1" stroke-width="1"/><text x="187.82500000000002" y="1081.4" font-size="14.5" fill="#334155" font-weight="400" text-anchor="start">Intended access</text><rect x="324.725" y="1063.4" width="173.38000000000002" height="26" rx="13" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1"/><text x="335.725" y="1081.4" font-size="14.5" fill="#334155" font-weight="400" text-anchor="start">Separate assessment</text><rect x="505.105" y="1063.4" width="132.78000000000003" height="26" rx="13" fill="#fff" stroke="#cbd5e1" stroke-width="1"/><text x="516.105" y="1081.4" font-size="14.5" fill="#334155" font-weight="400" text-anchor="start">Dashed: planned</text><rect x="34" y="1096.4" width="153.08" height="26" rx="13" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/><text x="45" y="1114.4" font-size="14.5" fill="#92400e" font-weight="400" text-anchor="start">Amber: my approval</text></svg>