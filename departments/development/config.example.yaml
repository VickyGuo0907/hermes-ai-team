# Merge into ~/.hermes/profiles/development-dept/config.yaml
#
# Keep the `model:` block that `hermes -p development-dept model` wrote.
# I chose the Codex subscription provider and signed in through the browser.

# Local fallback. Hermes Agent switches right away on a 404 or auth error, and
# after retries on rate limits and server errors. At most once per turn.
fallback_providers:
  - provider: lmstudio
    model: "YOUR_LOCAL_MODEL_ID"          # exact id from: curl http://127.0.0.1:1234/v1/models
    base_url: "http://127.0.0.1:1234/v1"
    api_mode: chat_completions

platform_toolsets:
  cli: [kanban, memory, no_mcp]
  discord: [kanban, memory, no_mcp]

# Coordination only while setting up. These are not a security boundary.
kanban:
  dispatch_in_gateway: false
  dispatch_profiles: []
